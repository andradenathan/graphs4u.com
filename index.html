				<h1>graphs4u — graph algorithm visualizer</h1>
				<p>
					graphs4u lets you draw a graph in the browser and run classic graph algorithms on it:
					breadth-first search (BFS), depth-first search (DFS), Dijkstra, Bellman-Ford, Kruskal,
					Prim and topological sort. It is free, open source (MIT) and requires no account.
				</p>
				<p>
					The editor needs JavaScript to run. Please enable JavaScript, or read the
					<a href="https://github.com/andradenathan/graphs4u.com" style="color: #5b7ef6;">source code on GitHub</a>.
				</p>
			</div>
